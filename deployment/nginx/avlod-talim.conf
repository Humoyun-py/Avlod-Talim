# Replace example.uz and the frontend root with the actual deployment values.
upstream avlod_talim_api {
    server unix:/run/avlod-talim/gunicorn.sock;
}

server {
    listen 80;
    server_name api.example.uz;
    client_max_body_size 20m;

    location /static/ {
        alias /srv/avlod-talim/backend/staticfiles/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Deliberately no /media/ alias: receipts and submissions are private.
    location / {
        proxy_pass http://avlod_talim_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
        proxy_connect_timeout 5s;
    }
}
