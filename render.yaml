databases:
  - name: avlod-talim-db
    databaseName: avlod_talim
    user: avlod_talim
    plan: free
    postgresMajorVersion: "18"
    ipAllowList: []

services:
  - type: web
    name: avlod-talim-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: python manage.py migrate --noinput && python manage.py bootstrap_staff_accounts && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 --access-logfile - --error-logfile -
    healthCheckPath: /
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: avlod-talim-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: avlod-talim.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: SECURE_HSTS_SECONDS
        value: "3600"
